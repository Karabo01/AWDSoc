# Local development only. Coolify runs the production topology; see
# deploy/coolify/README.md.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: awdsoc
      POSTGRES_PASSWORD: awdsoc
      POSTGRES_DB: awdsoc
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awdsoc"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

volumes:
  pgdata:
  redisdata:
